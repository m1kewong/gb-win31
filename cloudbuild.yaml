steps:
  - name: ghcr.io/gbdk-2020/gbdk-2020:4.5.0
    entrypoint: make
    args: ["LCC=lcc", "all"]
  - name: python:3.12-slim
    entrypoint: python3
    args: ["tools/verify_rom.py", "build/gb-win31.gbc"]

artifacts:
  objects:
    location: ${_ARTIFACT_LOCATION}
    paths: ["build/gb-win31.gbc"]

substitutions:
  _ARTIFACT_LOCATION: gs://${PROJECT_ID}-gb-win31/releases/${BUILD_ID}/
